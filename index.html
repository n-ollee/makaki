<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macaques – a field guide</title>
<meta name="description" content="Explore the macaques: 23 species of monkeys from Japan to Gibraltar.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eeea; --panel:#f6f8f6; --ink:#232b26; --muted:#5a665e; --line:#c5cfc8;
  --fur:#9a8776; --fur-dark:#6e5e50; --face:#d4574a; --face-cold:#e7b7ae; --steam:#8fb7c4; --accent:#b8402f;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --body:'Source Serif 4',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171d19;--panel:#202823;--ink:#e8eee9;--muted:#9fada4;--line:#34403a;--accent:#ec7c6a;--face-cold:#b98a82}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 var(--body)}
h1,h2,h3{font-family:var(--head);line-height:1.05;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{display:flex;gap:22px;justify-content:space-between;align-items:center;padding:18px 0;font-family:var(--head);font-weight:700}
nav div{display:flex;gap:20px}
nav a{color:var(--ink);text-decoration:none}
nav a:hover{color:var(--accent)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:30px 0 70px}
.hero h1{font-size:clamp(2.8rem,7vw,5.2rem);font-weight:800;letter-spacing:-.03em}
.hero p.lead{font-size:1.2rem;max-width:34em;color:var(--muted)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;position:relative;overflow:hidden}
.stage svg{width:100%;height:auto;display:block}
.ctrl{margin-top:8px}
.ctrl label{font-family:var(--head);font-weight:700;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
#tempNote{margin:6px 0 0;font-size:.95rem;color:var(--muted);min-height:3.4em}
.steam{animation:rise 4s ease-in infinite;opacity:0}
.steam:nth-of-type(2){animation-delay:1.3s}.steam:nth-of-type(3){animation-delay:2.4s}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-26px)}}
section{padding:60px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(2rem,4.5vw,3rem);font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
.intro{max-width:40em;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:28px}
.fact{padding:18px 0;border-top:3px solid var(--fur)}
.fact b{font-family:var(--head);font-size:1.15rem;display:block;margin-bottom:4px}
.fact span{color:var(--muted);font-size:.98rem;display:block;line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.chip{font:700 .95rem var(--head);border:2px solid var(--ink);background:transparent;color:var(--ink);padding:7px 15px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.explorer{display:grid;grid-template-columns:260px 1fr;gap:26px}
.list{display:flex;flex-direction:column;gap:6px}
.sp{font:600 1rem var(--head);text-align:left;padding:11px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sp[aria-selected=true]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.sp small{font-weight:500;color:var(--muted)}
.sp[hidden]{display:none}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}
.detail h3{font-size:2rem;font-weight:800}
.detail em{color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.meta div{font-size:.95rem;line-height:1.4}
.meta b{display:block;font-family:var(--head)}
.status{display:inline-block;padding:2px 12px;border-radius:99px;font:700 .9rem var(--head);color:#fff}
.s-lc{background:#4d7a5c}.s-nt{background:#8a8a3a}.s-vu{background:#b27a22}.s-en{background:#c0502d}.s-cr{background:#9b2330}
.bar{height:10px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fur-dark);transition:width .5s}
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;max-width:720px}
.quiz h3{font-size:1.5rem;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{font:500 1.05rem var(--body);text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:#4d7a5c;background:color-mix(in srgb,#4d7a5c 22%,var(--bg))}
.opt.wrong{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.why{margin-top:14px;color:var(--muted);min-height:3em}
.btn{font:700 1rem var(--head);background:var(--ink);color:var(--bg);border:0;padding:11px 22px;border-radius:99px;cursor:pointer;margin-top:10px}
.prog{font:700 .95rem var(--head);color:var(--muted)}
footer{padding:36px 0 60px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}
@media(max-width:800px){.hero,.explorer{grid-template-columns:1fr}.list{flex-direction:row;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.steam{animation:none;opacity:.4}html{scroll-behavior:auto}}

.right-nav{display:flex;gap:18px;align-items:center}
.lang{padding:4px 12px}
#consent{position:fixed;left:14px;right:14px;bottom:14px;max-width:560px;background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 18px;font:500 .95rem/1.5 var(--head);z-index:9;display:none;gap:12px;flex-direction:column;box-shadow:0 8px 30px #0004}
#consent .row{display:flex;gap:10px}
#consent button{font:700 .95rem var(--head);border-radius:99px;padding:8px 18px;cursor:pointer;border:2px solid var(--bg);background:transparent;color:var(--bg)}
#consent button.y{background:var(--bg);color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
nav{flex-wrap:wrap}.brand{font-family:var(--head);font-weight:800;color:var(--ink);text-decoration:none}
.navl{display:flex;gap:16px;flex-wrap:wrap}.navl a[aria-current=page]{border-bottom:3px solid var(--accent)}
.page[hidden]{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:22px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}.card b{font:800 1.2rem var(--head);display:block}.card span{color:var(--muted);font-size:.95rem;line-height:1.45;display:block;margin-top:4px}
.pg{padding:30px 0 10px}.pg h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;letter-spacing:-.03em}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}.mapbox svg{display:block;width:100%;height:auto}
.kid{background:color-mix(in srgb,var(--steam) 25%,var(--panel));border-radius:16px;padding:14px 18px;margin:22px 0;font-size:1rem;max-width:44em}
.big{font:800 clamp(4rem,14vw,7rem)/1 var(--head);color:var(--accent)}
.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center;margin:12px 0;font-size:.98rem}
.brow .bar{margin:0;height:14px}.brow .bar i{background:var(--accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:18px}
.two h3{font-size:1.2rem;margin-bottom:6px}.two p{margin:0;color:var(--muted);font-size:1rem;line-height:1.55}
.tl{display:grid;gap:12px;margin-top:22px}
.tli{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);opacity:.3;transition:opacity .3s}
.tli.on{opacity:1}.tli .em{font-size:2rem;text-align:center}.tli b{font-family:var(--head)}.tli span{display:block;color:var(--muted);font-size:.95rem}
.clock{font:800 2.4rem var(--head);margin:14px 0 2px}
.gg{display:grid;grid-template-columns:repeat(4,minmax(52px,72px));gap:8px;margin:16px 0}
.gc{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:800 1.5rem var(--head);color:var(--ink);cursor:pointer}
.gc[disabled]{opacity:.35;cursor:default}.gc.hid{background:var(--ink);color:var(--ink)}.gc.ok{border-color:#4d7a5c}
</style>
</head>
<body>
<div class="wrap">
  <nav><a class="brand" href="#/" data-t="brand"></a><div class="right-nav"><span class="navl" id="navLinks"></span><button class="chip lang" id="lang" type="button"></button></div></nav>

  <div class="page" id="p-home">
  <header class="hero">
    <div>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <div class="stage">
      <svg id="heroSvg" viewBox="0 0 400 320" role="img">
        <rect width="400" height="320" rx="20" fill="var(--steam)" opacity=".18"/>
        <g id="snow" fill="#fff"></g>
        <g class="steam" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M90 230c-10-14 10-22 0-38"/></g>
        <g class="steam" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M310 235c-10-14 10-22 0-38"/></g>
        <g class="steam" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M200 245c-10-14 10-22 0-38"/></g>
        <circle cx="105" cy="118" r="30" fill="var(--fur-dark)"/><circle cx="295" cy="118" r="30" fill="var(--fur-dark)"/>
        <circle cx="105" cy="118" r="16" id="ear1" fill="var(--face)"/><circle cx="295" cy="118" r="16" id="ear2" fill="var(--face)"/>
        <ellipse cx="200" cy="140" rx="112" ry="104" fill="var(--fur)"/>
        <path id="face" d="M200 70c-48 0-78 34-78 70 0 40 30 66 78 66s78-26 78-66c0-36-30-70-78-70z" fill="var(--face)"/>
        <ellipse cx="200" cy="82" rx="62" ry="14" fill="var(--fur)"/>
        <circle cx="165" cy="130" r="9" fill="#1c1410"/><circle cx="235" cy="130" r="9" fill="#1c1410"/>
        <circle cx="168" cy="127" r="3" fill="#fff"/><circle cx="238" cy="127" r="3" fill="#fff"/>
        <ellipse cx="200" cy="165" rx="26" ry="18" fill="#00000022"/>
        <circle cx="190" cy="163" r="4" fill="#1c1410"/><circle cx="210" cy="163" r="4" fill="#1c1410"/>
        <path id="mouth" d="M180 188q20 10 40 0" fill="none" stroke="#1c1410" stroke-width="4" stroke-linecap="round"/>
        <path d="M0 232q50-14 100 0t100 0t100 0t100 0V320H0z" fill="var(--steam)"/>
        <path d="M0 250q50-14 100 0t100 0t100 0t100 0V320H0z" fill="var(--steam)" opacity=".7"/>
      </svg>
      <div class="ctrl">
        <label for="temp"><span data-t="air"></span><span id="tv"></span></label>
        <input id="temp" type="range" min="-15" max="25" value="-5">
        <p id="tempNote" aria-live="polite"></p>
      </div>
    </div>
  </header>

  <section id="explore"><h2 id="exH"></h2><div class="cards" id="cards"></div></section>

  <section id="about">
    <h2 data-t="aboutH"></h2>
    <p class="intro" data-t="aboutP"></p>
    <div class="facts">
      <div class="fact"><b data-t="f1b"></b><span data-t="f1s"></span></div>
      <div class="fact"><b data-t="f2b"></b><span data-t="f2s"></span></div>
      <div class="fact"><b data-t="f3b"></b><span data-t="f3s"></span></div>
      <div class="fact"><b data-t="f4b"></b><span data-t="f4s"></span></div>
    </div>
  </section>

  <section id="species">
    <h2 data-t="spH"></h2>
    <p class="intro" data-t="spP"></p>
    <div class="filters" id="filters" role="group"></div>
    <div class="explorer">
      <div class="list" id="list" role="tablist" aria-orientation="vertical"></div>
      <article class="detail" id="detail" role="tabpanel" aria-live="polite"></article>
    </div>
  </section>

  <section id="quiz">
    <h2 data-t="quizH"></h2>
    <div class="quiz" id="quizBox"></div>
  </section>
  </div>
  <div class="page" id="p-map" hidden></div>
  <div class="page" id="p-numbers" hidden></div>
  <div class="page" id="p-brains" hidden></div>
  <div class="page" id="p-time" hidden></div>

  <footer><span data-t="foot"></span> <a href="https://www.iucnredlist.org" target="_blank" rel="noopener">iucnredlist.org</a>. <button class="linkbtn" id="cookieBtn" type="button" data-t="cookies"></button></footer>
</div>

<div id="consent" role="dialog" aria-live="polite">
  <span data-t="cText"></span>
  <div class="row"><button class="y" id="cYes" type="button" data-t="cYes"></button><button id="cNo" type="button" data-t="cNo"></button></div>
</div>

<script>
const GA_ID='G-ZEY6X03WKK'; 
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- Translations ----------
const T={
en:{brand:'Macaque Field Guide',nSp:'Species',nQuiz:'Quiz',
 h1:'Meet the macaques.',
 lead:'Around two dozen species of monkeys, from snowy Japanese mountains to a rock in Gibraltar. They are clever, social and surprisingly adaptable. Start by warming up this snow monkey.',

pl:{brand:'Przewodnik po makakach',nSp:'Gatunki',nQuiz:'Quiz',

 svg:'Rysunkowy makak japoński siedzący w gorącym źródle',air:'Temperatura powietrza',
 aboutH:'Czym jest makak?',

 f1b:'Około 23 gatunków',f1s:'Prawie wszystkie żyją w Azji. Jeden, makak magot, mieszka w Afryce Północnej.',
 f2b:'Worki policzkowe',f2s:'Chowają jedzenie w policzkach i zjadają je później, z dala od rywali.',
 f3b:'Stada z hierarchią',f3s:'Grupy mają społeczną hierarchię, utrzymywaną przez iskanie i sojusze.',
 f4b:'Wiele jest zagrożonych',f4s:'Utrata siedlisk oraz handel zwierzętami i mięsem zagrażają wielu gatunkom.',
 spH:'Przeglądarka gatunków',spP:'Wybierz region, a potem gatunek.',filt:'Filtruj według regionu',spec:'Gatunki',all:'Wszystkie',
 status:'Status',found:'Występowanie',hab:'Siedlisko',wt:'Masa',size:'Względny rozmiar',
 quizH:'Sprawdź swoją wiedzę o makakach',qOf:'Pytanie {a} z {b}',ok:'Dobrze. ',no:'Nie do końca. ',next:'Następne pytanie',see:'Zobacz wynik',fin:'Koniec',again:'Zagraj ponownie',
 m5:'Przywódca stada. Wszystko dobrze!',m3:'Niezłe iskanie. Znasz się na makakach.',m0:'Nowy rekrut. Przejrzyj gatunki powyżej i spróbuj jeszcze raz.',

 title:'Makaki – przewodnik',

 st:{lc:'Najmniejszej troski',nt:'Bliski zagrożenia',vu:'Narażony',en:'Zagrożony',cr:'Krytycznie zagrożony'}}
};
const RP={'All':'Wszystkie','East Asia':'Azja Wschodnia','South Asia':'Azja Południowa','Southeast Asia':'Azja Południowo-Wschodnia','Africa & Europe':'Afryka i Europa'};
let lang=store.get('lang')||((navigator.language||'').toLowerCase().startsWith('pl')?'pl':'en');
const t=k=>T[lang][k];
const L=x=>x[lang==='pl'?1:0];
const reg=r=>lang==='pl'?RP[r]:r;

// ---------- Analytics (only after consent) ----------
let gaLoaded=false;
function ev(n,p){if(gaLoaded&&window.gtag)gtag('event',n,p||{})}
function loadGA(){
  if(gaLoaded||GA_ID==='G-XXXXXXXXXX')return;
  const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};
  gtag('js',new Date());gtag('config',GA_ID);gaLoaded=true;
}
const banner=$('consent');
function setConsent(v){store.set('ga_consent',v);banner.style.display='none';if(v==='yes')loadGA()}
$('cYes').onclick=()=>setConsent('yes');$('cNo').onclick=()=>setConsent('no');
$('cookieBtn').onclick=()=>{banner.style.display='flex'};
const c=store.get('ga_consent');
if(c==='yes')loadGA();else if(!c)banner.style.display='flex';

// ---------- Hero ----------
const temp=$('temp'),tv=$('tv'),note=$('tempNote');
const lerp=(a,b,x)=>Math.round(a+(b-a)*x);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const cold=hex('#e7b7ae'),warm=hex('#d4574a');
const snow=$('snow');
for(let i=0;i<14;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','circle');e.setAttribute('cx',Math.random()*400);e.setAttribute('cy',Math.random()*210);e.setAttribute('r',1.5+Math.random()*2.5);snow.appendChild(e)}
function update(){
  const v=+temp.value,x=(v+15)/40;
  const col=`rgb(${[0,1,2].map(i=>lerp(cold[i],warm[i],x)).join()})`;
  ['face','ear1','ear2'].forEach(id=>$(id).setAttribute('fill',col));
  $('mouth').setAttribute('d',v<-2?'M180 192q20-8 40 0':'M180 188q20 12 40 0');
  snow.style.opacity=v<=2?1:v<8?.5:0;
  tv.textContent=v+' °C';
  note.textContent=t('notes').find(n=>v<=n[0])[1];

let region='All',sel=0;
function renderFilters(){

    region=b.dataset.r;sel=S.findIndex(s=>region==='All'||s.r===region);
    ev('region_filter',{region});renderFilters();renderList();renderDetail();

function renderDetail(){

let qi=0,score=0,finished=false;
function showQ(){
  finished=false;

  box.innerHTML=`<div class="prog">${t('qOf').replace('{a}',qi+1).replace('{b}',Q.length)}</div><h3>${L(q.q)}</h3>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${L(o)}</button>`).join('')}</div>
  <p class="why" id="why" aria-live="polite"></p><div id="nx"></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('right')});
    if(i===q.a)score++;else b.classList.add('wrong');
    $('why').textContent=t(i===q.a?'ok':'no')+L(q.e);

    $('go').onclick=()=>{qi++;qi<Q.length?showQ():done()};
    $('go').focus();
  });
}
function done(){
  if(!finished)ev('quiz_complete',{score});finished=true;
  const m=score===5?t('m5'):score>=3?t('m3'):t('m0');
  $('quizBox').innerHTML=`<div class="prog">${t('fin')}</div><h3>${score} / ${Q.length}</h3><p>${m}</p><button class="btn" id="re">${t('again')}</button>`;
  $('re').onclick=()=>{qi=0;score=0;showQ()};
}

// Map
let mapSel=-1;
function renderMap(){
  const px=(lo,la)=>[(lo+20)*5,(60-la)*5];
  const dots=S.map((s,i)=>(mapSel===-1||mapSel===i)?R[i].map(([lo,la,r])=>{const [x,y]=px(lo,la);return `<circle cx="${x}" cy="${y}" r="${Math.max(5,r*5)}" fill="var(--accent)" opacity="${mapSel===-1?.3:.6}" stroke="var(--accent)" stroke-width="1.5"/>`}).join(''):'').join('');
  const lab=(x,y,tx)=>`<text x="${x}" y="${y}" fill="var(--muted)" font-size="15" font-family="var(--head)" font-weight="700" text-anchor="middle" opacity=".8">${tx}</text>`;
  const cap=mapSel===-1?X('Tap a species to see where it lives. Red circles show the rough area, not exact borders.','Kliknij gatunek, aby zobaczyć, gdzie żyje. Czerwone koła pokazują przybliżony obszar, a nie dokładne granice.'):`<b>${L(S[mapSel].n)}</b>: ${L(S[mapSel].a)}. ${L(S[mapSel].f)}`;
  $('p-map').innerHTML=pg(X('Where macaques live','Gdzie żyją makaki'),X('Macaques live across Asia, plus one species in North Africa. No other monkey group except humans lives in so many different places.','Makaki żyją w całej Azji, a jeden gatunek w Afryce Północnej. Żadna inna grupa małp poza ludźmi nie występuje w tak wielu miejscach.'),
  `<div class="filters" role="group"><button class="chip" aria-pressed="${mapSel===-1}" data-m="-1">${X('All species','Wszystkie')}</button>${S.map((s,i)=>`<button class="chip" aria-pressed="${mapSel===i}" data-m="${i}">${L(s.n)}</button>`).join('')}</div>
  <div class="mapbox"><svg viewBox="0 0 850 375" role="img" aria-label="${X('Map of Africa and Asia showing where macaques live','Mapa Afryki i Azji pokazująca, gdzie żyją makaki')}"><rect width="850" height="375" fill="color-mix(in srgb,var(--steam) 30%,var(--bg))"/><path d="${LAND}" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>${lab(200,285,X('AFRICA','AFRYKA'))}${lab(175,60,X('EUROPE','EUROPA'))}${lab(560,80,X('ASIA','AZJA'))}${lab(600,330,X('Indian Ocean','Ocean Indyjski'))}${dots}</svg></div>
  <p id="mCap" aria-live="polite" style="max-width:48em">${cap}</p>
  <div class="kid">🧒 ${X('<b>For kids:</b> Most macaques live in warm forests, but Japanese macaques live where it snows. The Barbary macaque is the only one that lives in Africa, and a small group lives on the Rock of Gibraltar in Europe.','<b>Dla dzieci:</b> Większość makaków mieszka w ciepłych lasach, ale makaki japońskie żyją tam, gdzie pada śnieg. Makak magot jako jedyny mieszka w Afryce, a mała grupa żyje na Skale Gibraltarskiej w Europie.')}</div>`);
  $('p-map').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mapSel=+b.dataset.m;if(mapSel>=0)ev('map_species',{species:S[mapSel].n[0]});renderMap()});
}
// Numbers
function renderNumbers(){
  const pop=[[['Japanese macaque','Makak japoński'],100000,X('100,000 or more','100 tys. lub więcej')],[['Barbary macaque','Makak magot'],8000,X('fewer than 10,000','poniżej 10 tys.')],[['Lion-tailed macaque','Makak wanderu'],3500,X('about 3,000–4,000','około 3–4 tys.')]];
  $('p-numbers').innerHTML=pg(X('Numbers','Liczby'),X('How many kinds of macaque are there, and how many animals?','Ile jest rodzajów makaków i ile jest zwierząt?'),
  `<section><div class="big">≈ 23</div><h2>${X('species of macaque','gatunków makaków')}</h2>
  <p class="intro">${X('Scientists do not all agree on the exact number. Some counts say 22, others 25, because new species are still being described and some are split or merged. Almost all live in Asia.','Naukowcy nie są zgodni co do dokładnej liczby. Jedne źródła podają 22, inne 25, ponieważ wciąż opisuje się nowe gatunki, a niektóre dzieli się lub łączy. Prawie wszystkie żyją w Azji.')}</p>
  <div class="kid">🧒 ${X('<b>Island of macaques:</b> Sulawesi, one island in Indonesia, is home to seven macaque species that live nowhere else on Earth.','<b>Wyspa makaków:</b> Na Celebes, jednej wyspie w Indonezji, żyje siedem gatunków makaków, których nie ma nigdzie indziej na świecie.')}</div></section>
  <section><h2>${X('How many animals?','Ile jest zwierząt?')}</h2>
  <p class="intro">${X('Some macaques are very common, others are rare. These are rough estimates and sources differ. The bars are drawn to the same scale.','Niektóre makaki są bardzo pospolite, inne rzadkie. To przybliżone szacunki, a źródła się różnią. Słupki narysowano w tej samej skali.')}</p>
  ${pop.map(p=>`<div class="brow"><span><b>${L(p[0])}</b><br>${p[2]}</span><div class="bar"><i style="width:${Math.max(1.5,p[1]/1000)}%"></i></div></div>`).join('')}
  <div class="two"><div><h3>${X('Very common','Bardzo pospolite')}</h3><p>${X('Rhesus and long-tailed macaques live in huge numbers across Asia and thrive near people. Even so, long-tailed macaques are now listed as Endangered because their numbers are falling.','Makaki rezus i jawajskie występują w ogromnej liczbie w całej Azji i dobrze radzą sobie blisko ludzi. Mimo to makaki jawajskie są dziś uznane za zagrożone, bo ich liczba spada.')}</p></div>
  <div><h3>${X('Rare and shrinking','Rzadkie i coraz mniej licznie')}</h3><p>${X('Crested black macaques lost about four fifths of their population over a few decades, mostly to hunting and forest loss. Lion-tailed and Barbary macaques are Endangered too.','Makaki czubate straciły około czterech piątych populacji w ciągu kilku dekad, głównie przez polowania i wycinkę lasów. Makaki wanderu i magoty także są zagrożone.')}</p></div>
  <div><h3>${X('How we can help','Jak możemy pomóc')}</h3><p>${X('Protecting forests helps most. If you meet wild monkeys, watch from a distance and never feed them. Human food makes them sick and less afraid of people.','Najwięcej daje ochrona lasów. Jeśli spotkasz dzikie małpy, obserwuj je z daleka i nigdy ich nie karm. Ludzkie jedzenie je rozchorowuje i odzwyczaja od strachu przed ludźmi.')}</p></div></div></section>`);
}
// Brains + game
let gN=3,gNext=1,gCells=[];
function gStart(){
  gNext=1;const pos=[...Array(16).keys()].sort(()=>Math.random()-.5).slice(0,gN);
  gCells=Array(16).fill(0);pos.forEach((c,i)=>gCells[c]=i+1);
  gDraw('show',X('Click 1 first. Then the other numbers hide, so click them in order from memory.','Kliknij najpierw 1. Potem pozostałe liczby znikną, więc klikaj je po kolei z pamięci.'));
}
function gDraw(st,msg){
  $('gGrid').innerHTML=gCells.map((v,i)=>!v?`<span></span>`:`<button class="gc ${st==='hide'&&v>=gNext?'hid':''} ${v<gNext?'ok':''}" data-v="${v}" ${(st==='over'||v<gNext)?'disabled':''}>${st==='hide'&&v>=gNext?'':(v<gNext&&st==='hide'?'✓':v)}</button>`).join('');
  $('gMsg').textContent=msg;$('gNext').hidden=st!=='won';
  $('gGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v;
    if(v!==gNext){gDraw('over',X('Oops, that was not the next number. Try this round again.','Ups, to nie była następna liczba. Spróbuj tej rundy jeszcze raz.'));$('gNext').hidden=false;$('gNext').textContent=X('Try again','Spróbuj ponownie');gMode='again';return}
    gNext++;
    if(gNext>gN){gDraw('won',X('Perfect! You remembered all '+gN+' positions.','Świetnie! Zapamiętano wszystkie pozycje ('+gN+').'));$('gNext').hidden=false;$('gNext').textContent=gN<9?X('Next round','Następna runda'):X('Play again','Zagraj ponownie');gMode='next';ev('brain_game_round',{numbers:gN});return}
    gDraw('hide',X('Keep going: which number is next?','Dalej: która liczba jest następna?'));
  });
}
let gMode='next';
function renderBrains(){
  $('p-brains').innerHTML=pg(X('Clever monkeys','Mądre małpy'),X('Macaques solve problems, learn from each other and remember a lot about their troop.','Makaki rozwiązują problemy, uczą się od siebie i pamiętają wiele o swoim stadzie.'),
  `<section><div class="two">
  <div><h3>🪨 ${X('Tool use','Używanie narzędzi')}</h3><p>${X('Long-tailed macaques in Thailand use stones to crack open shellfish, nuts and oysters, and young monkeys learn the trick by watching.','Makaki jawajskie w Tajlandii rozbijają kamieniami muszle, orzechy i ostrygi, a młode uczą się tej sztuczki, patrząc na starsze.')}</p></div>
  <div><h3>🍠 ${X('Learning culture','Uczenie się kultury')}</h3><p>${X('In the 1950s, a young Japanese macaque on Koshima island began washing sweet potatoes in water. Others copied her, and the habit spread through the troop.','W latach 50. młody makak japoński na wyspie Koshima zaczął myć bataty w wodzie. Inne go naśladowały i zwyczaj rozprzestrzenił się w stadzie.')}</p></div>
  <div><h3>🔢 ${X('Numbers and order','Liczby i kolejność')}</h3><p>${X('In lab studies, rhesus macaques learn to put symbols and numbers in the right order, and they can tell when they are unsure of an answer.','W badaniach laboratoryjnych makaki rezus uczą się układać symbole i liczby we właściwej kolejności i potrafią poznać, że nie są pewne odpowiedzi.')}</p></div>
  <div><h3>👥 ${X('Social smarts','Inteligencja społeczna')}</h3><p>${X('Troops have ranks, friendships and alliances. Macaques recognise many individuals and use grooming to make friends and keep the peace.','Stada mają hierarchię, przyjaźnie i sojusze. Makaki rozpoznają wiele osobników, a iskaniem zawierają przyjaźnie i utrzymują pokój.')}</p></div></div>
  <div class="kid">🧠 ${X('A macaque brain weighs about 90 grams. A human brain is around 15 times heavier, at roughly 1,350 grams.','Mózg makaka waży około 90 gramów. Ludzki mózg jest około 15 razy cięższy, czyli waży mniej więcej 1350 gramów.')}</div></section>
  <section><h2>${X('Memory game','Gra pamięciowa')}</h2><p class="intro">${X('Scientists use number games like this to study memory in primates. Can you do it?','Naukowcy używają takich gier z liczbami do badania pamięci naczelnych. Dasz radę?')}</p>
  <div class="gg" id="gGrid"></div><p id="gMsg" aria-live="polite"></p><button class="btn" id="gNext" hidden></button></section>`);
  $('gNext').onclick=()=>{if(gMode==='next')gN=gN<9?gN+1:3;gStart()};
  gStart();
}
// Time
function renderTime(){
  const E=[[0,'🐒🦍',X('Old World monkeys and apes split','Małpy wąskonose i człekokształtne rozchodzą się'),X('about 30 million years ago','około 30 mln lat temu')],[80,'🌍',X('The first macaques appear','Pojawiają się pierwsze makaki'),X('about 5–6 million years ago, in North Africa','około 5–6 mln lat temu, w Afryce Północnej')],[99,'🧑',X('Our species, Homo sapiens, appears','Pojawia się nasz gatunek, Homo sapiens'),X('about 300,000 years ago','około 300 tys. lat temu')],[100,'🌏',X('Today','Dziś'),X('about 23 macaque species','około 23 gatunków makaków')]];
  $('p-time').innerHTML=pg(X('How long have macaques lived?','Od kiedy żyją makaki?'),X('The macaque family goes back about 5–6 million years, around 20 times longer than our own species. Fossils show they once lived in Europe too.','Rodzaj makaków sięga około 5–6 milionów lat wstecz, czyli około 20 razy dalej niż nasz gatunek. Skamieniałości pokazują, że kiedyś żyły też w Europie.'),
  `<section><label for="tSl"><b>${X('Travel through time','Podróż w czasie')}</b></label><input id="tSl" type="range" min="0" max="100" value="0" style="width:100%;accent-color:var(--accent)">
  <div class="clock" id="tClock"></div><p id="tAgo" style="margin:0;color:var(--muted)"></p>
  <div class="tl" id="tl">${E.map((e,i)=>`<div class="tli" data-v="${e[0]}"><div class="em" aria-hidden="true">${e[1]}</div><div><b>${e[2]}</b><span>${e[3]}</span></div></div>`).join('')}</div>
  <div class="kid">🧒 ${X('<b>Imagine all of this as one day.</b> Old World monkeys and apes split at midnight. Macaques show up at about 7 p.m. Humans arrive at about 11:45 p.m., just 15 minutes before the day ends.','<b>Wyobraź sobie to jako jedną dobę.</b> O północy małpy wąskonose i człekokształtne się rozchodzą. Makaki pojawiają się około 19:00. Ludzie przychodzą około 23:45, zaledwie 15 minut przed końcem doby.')}</div></section>`);
  const sl=$('tSl');let sent=false;
  const up=()=>{const v=+sl.value,m=Math.round(v/100*1440);
    $('tClock').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    const ago=30*(1-v/100);$('tAgo').textContent=ago<0.05?X('Today','Dziś'):X(ago>=1?ago.toFixed(1)+' million years ago':Math.round(ago*1000)+',000 years ago',ago>=1?ago.toFixed(1)+' mln lat temu':Math.round(ago*1000)+' tys. lat temu');
    $('tl').querySelectorAll('.tli').forEach(e=>e.classList.toggle('on',v>=+e.dataset.v))};
  sl.oninput=up;sl.onchange=()=>{if(!sent){sent=true;ev('timeline_slider')}};up();
}
function renderPages(){renderNav();renderMap();renderNumbers();renderBrains();renderTime()}
function route(){
  const h=location.hash,m=h.match(/^#\/(\w*)/);
  let p=m&&PG.some(x=>x[0]===m[1])?m[1]:'home';
  document.querySelectorAll('.page').forEach(e=>e.hidden=e.id!=='p-'+p);
  const changed=p!==cur;cur=p;renderNav();
  if(m)window.scrollTo(0,0);else if(h.length>1){const el=document.getElementById(h.slice(1));if(el)el.scrollIntoView()}
  if(changed)ev('subpage_view',{page:p});
}
window.addEventListener('hashchange',route);

// ---------- Language ----------
function applyLang(){
  document.documentElement.lang=lang;document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));
  $('heroSvg').setAttribute('aria-label',t('svg'));
  $('lang').textContent=lang==='pl'?'EN':'PL';
  $('lang').setAttribute('aria-label',lang==='pl'?'Switch to English':'Przełącz na polski');
  update();renderFilters();renderList();renderDetail();
  renderPages();
  finished?done():showQ();
}
$('lang').onclick=()=>{lang=lang==='pl'?'en':'pl';store.set('lang',lang);ev('language_change',{language:lang});applyLang()};
applyLang();route();
</script>
